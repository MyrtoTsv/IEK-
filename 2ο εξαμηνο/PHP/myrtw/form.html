<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Practicing using Forms</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <style>
        label{
            display: inline-block;
           
            clear: left;
            width: 50px;
            text-align: left;
        }

        input{
            display: inline-block;
           
        }

        fieldset{
            width: 260px;
            height: 100px;
        }
    </style>
</head>
<body>
    <form action="process.php" method="post">
        <fieldset>
            <label for="name">Όνομα</label>
            <input type="text" id="name" name="name" style="width: 190px;"><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" style="width: 190px;"><br><br>
            <input type="submit" id="button" name="koumpi" value="Υποβολή">
        </fieldset>
    </form>
</body>
</html>
